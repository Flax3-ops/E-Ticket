; Ekstensi tambahan lewat PHP_INI_SCAN_DIR untuk instance Apache uji (php.ini XAMPP tidak diubah).
; Pada XAMPP bawaan, OPcache nonaktif sehingga setiap permintaan mengompilasi ulang file framework.
zend_extension=opcache
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
