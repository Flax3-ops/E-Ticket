# Instance Apache XAMPP terpisah untuk uji aplikasi (port 8082). Tidak mengubah httpd.conf XAMPP.
# Jalankan: D:\xampp\apache\bin\httpd.exe -f <path>\scripts\apache-tiket.conf
Define SRVROOT "D:/xampp/apache"
ServerRoot "${SRVROOT}"
Listen 8082
ServerName localhost:8082
PidFile "${SRVROOT}/logs/httpd-tiket.pid"
ErrorLog "${SRVROOT}/logs/error-tiket.log"
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadFile "D:/xampp/php/php8ts.dll"
LoadModule php_module "D:/xampp/php/php8apache2_4.dll"
PHPIniDir "D:/xampp/php"
TypesConfig conf/mime.types
ThreadsPerChild 150
AcceptFilter http none
DocumentRoot "D:/Backup/Kuliah/Sems 7 26 - 27/Persiapan BNSP WebDev/Project-Individu/tiket-layanan/public"
<Directory "D:/Backup/Kuliah/Sems 7 26 - 27/Persiapan BNSP WebDev/Project-Individu/tiket-layanan/public">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
DirectoryIndex index.php
